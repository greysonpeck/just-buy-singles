<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css?v=1.55" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>Catalog: The Hobbit — Just Buy Singles</title>
    <style>
        body {
            background-image: url('img/HOB_bg.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
            pointer-events: none;
        }
        #page {
            position: relative;
            z-index: 1;
        }
        /* Mode toggle */
        .ma-toggle {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .ma-toggle button {
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            color: white;
            white-space: nowrap;
        }
        .ma-btn-active {
            background: linear-gradient(to bottom, rgba(80, 50, 150, 0.95), rgba(110, 80, 185, 0.8));
        }
        .ma-btn-inactive {
            background: linear-gradient(to bottom, rgba(35, 35, 45, 0.95), rgba(60, 60, 75, 0.8));
            color: rgba(255,255,255,0.65) !important;
        }
        /* Responsive card width */
        .ma-card { width: 200px; }
        @media (max-width: 480px) {
            .ma-card { width: 150px; }
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1084747507972985"
     crossorigin="anonymous"></script>
</head>
<body class="text-white font-[Raleway]">
    <div id="page" class="max-w-[1280px] mx-auto px-4 sm:px-8 py-10">

        <!-- Header -->
        <div class="mb-4">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-wide">The Hobbit Price Guide</h1>
            <p class="text-white/60 mt-1 text-sm flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3"><span>TCGPlayer prices via Scryfall<span id="fetch-date"></span></span><span id="catalog-currency"></span></p>

            <!-- Tab toggle -->
            <div id="mode-toggle" class="ma-toggle mt-4"></div>
        </div>

        <!-- Loading state -->
        <div id="loading" class="text-white/60 text-lg py-20 text-center">Loading cards…</div>

        <!-- Buckets rendered here -->
        <div id="buckets" class="flex flex-col gap-8"></div>

        <!-- Footer -->
        <p class="text-white/30 text-xs mt-12 pb-6">
            Card prices and images via <a href="https://scryfall.com" class="underline hover:text-white/60" target="_blank">Scryfall</a>.
            Prices are TCGPlayer market price. Covers both The Hobbit (HOB) and Middle-earth Classic (HOC) treatments.
        </p>
    </div>

    <script src="./src/money.js?v=1.43"></script>
    <script src="./src/catalog.js?v=1.51"></script>
    <script>
        initCategoryCatalog({
            tabs: [
                {
                    id: 'default',
                    label: 'Default Frame',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28rarity%3Ar+OR+rarity%3Am%29+cn%3C%3D188&unique=cards',
                },
                {
                    id: 'battle-of-five-armies',
                    label: 'Battle of Five Armies EA',
                    alwaysShowNormal: true,
                    query: 'set%3Ahoc+%28cn%3E%3D98+AND+cn%3C%3D106%29&unique=cards',
                },
                {
                    id: 'book-cover',
                    label: 'Book Cover',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28cn%3E%3D239+AND+cn%3C%3D248%29&unique=cards',
                },
                {
                    id: 'book-cover-surge',
                    label: 'Book Cover (Surge Foil)',
                    foilOnly: true,
                    query: 'set%3Ahob+%28cn%3E%3D275+AND+cn%3C%3D284%29&unique=cards',
                },
                {
                    id: 'dragon-hoard',
                    label: 'Dragon Hoard',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28cn%3E%3D214+AND+cn%3C%3D238%29&unique=cards',
                },
                {
                    id: 'dragon-hoard-surge',
                    label: 'Dragon Hoard (Surge Foil)',
                    foilOnly: true,
                    query: 'set%3Ahob+%28cn%3E%3D250+AND+cn%3C%3D274%29&unique=cards',
                },
                {
                    id: 'dwarvish-language',
                    label: 'Dwarvish Language',
                    alwaysShowNormal: true,
                    query: 'set%3Ahoc+%28cn%3E%3D93+AND+cn%3C%3D97%29&unique=cards',
                },
                {
                    id: 'extended-art',
                    label: 'Extended Art',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28cn%3E%3D285+AND+cn%3C%3D312%29&unique=cards',
                },
                {
                    id: 'classic-artist',
                    label: 'Middle-earth Classic Artist',
                    alwaysShowNormal: true,
                    query: '%28set%3Ahoc+%28cn%3E%3D13+AND+cn%3C%3D52%29%29+OR+%28set%3Ahoc+%28cn%3E%3D53+AND+cn%3C%3D92%29%29&unique=cards',
                },
                {
                    id: 'journey-land',
                    label: 'Middle-earth Journey Land',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28cn%3E%3D194+AND+cn%3C%3D198%29&unique=cards',
                },
                {
                    id: 'scene',
                    label: 'Scene',
                    alwaysShowNormal: true,
                    query: 'set%3Ahob+%28cn%3E%3D199+AND+cn%3C%3D213%29&unique=cards',
                },
                {
                    id: 'hoc-scene',
                    label: 'Scene (HOC)',
                    alwaysShowNormal: true,
                    query: 'set%3Ahoc+%28cn%3E%3D1+AND+cn%3C%3D12%29&unique=cards',
                },
            ],
        });
    </script>
</body>
</html>
